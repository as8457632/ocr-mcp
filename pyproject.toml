[project]
name = "ocr-mcp"
version = "0.1.0"
description = "OCR MCP 工具：基于多模态模型的 OCR 识别（服务端 + 客户端）"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
