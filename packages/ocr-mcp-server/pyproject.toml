[project]
name = "ocr-mcp-server"
version = "0.1.0"
description = "OCR MCP 服务端：持有模型密钥，通过多模态模型执行 OCR 识别"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "openai>=1.40",
]

[project.scripts]
ocr-mcp-server = "ocr_mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
