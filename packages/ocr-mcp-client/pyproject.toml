[project]
name = "ocr-mcp-client"
version = "0.1.0"
description = "OCR MCP 客户端：本地 stdio MCP server，将图片转为 base64 转发给服务端"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2,<2",
]

[project.scripts]
ocr-mcp-client = "ocr_mcp_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_mcp_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
